# =============================================================================
# ~/.tmux.conf — Gino's Super Dev Env (tmux 3.7+)
# =============================================================================
# Built for longtime GNU Screen & Vi users integrating Neovim 0.12 + Antigravity CLI (agy).
#
# Key Highlights:
#   - Prefix: Ctrl-a (GNU Screen style)
#   - Ctrl-a Ctrl-a : Last active window
#   - Ctrl-a a      : Send literal Ctrl-a to underlying app
#   - Ctrl-a | or h : Horizontal split in current directory
#   - Ctrl-a - or v : Vertical split in current directory
#   - Ctrl-a K      : Kill current pane (with confirmation)
#   - Ctrl-a Esc    : Vi copy-mode (v = select, y = yank via universal dev-copy)
#   - Ctrl-h/j/k/l  : Seamless navigation between Neovim splits and tmux panes
#   - Ctrl-a g      : Toggle floating Antigravity CLI (agy) popup
#   - Ctrl-a G      : Open right-hand Antigravity CLI (agy) side pane (38%)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Shell, Terminal, TrueColor, and Neovim Responsiveness
# -----------------------------------------------------------------------------
# Cross-platform Bash detection (Linux /bin/bash -> Intel Mac /usr/local/bin/bash -> Apple Silicon /opt/homebrew/bin/bash)
if-shell "[ -x /bin/bash ]" "set -g default-shell /bin/bash"
if-shell "[ -x /usr/local/bin/bash ]" "set -g default-shell /usr/local/bin/bash"
if-shell "[ -x /opt/homebrew/bin/bash ]" "set -g default-shell /opt/homebrew/bin/bash"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q' # Pass through block/beam cursor shape
set -s set-clipboard on         # Enable OSC 52 clipboard passthrough for Linux & SSH sessions
set -sg escape-time 10          # Instant <Esc> in Neovim and bash vi-mode
set -g focus-events on          # Required so Neovim auto-reloads files edited by agy
set -g history-limit 100000     # Matches defscrollback 100000 from ~/.screenrc
set -g mouse off                # Keep native terminal mouse selection & copy/paste

# Update terminal emulator window/tab title
set -g set-titles on
set -g set-titles-string '#S:#I.#P #W'

# Visual bell (matches ~/.screenrc vbell on)
set -g visual-bell on
set -g bell-action none

# -----------------------------------------------------------------------------
# 2. Prefix: Ctrl-a (GNU Screen style)
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind a send-prefix              # Ctrl-a a sends literal Ctrl-a to shell/nvim
bind C-a last-window            # Ctrl-a Ctrl-a toggles last active window
bind l last-window

# Reload config on the fly with Ctrl-a r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# -----------------------------------------------------------------------------
# 3. Screen-Style Window & Pane Management
# -----------------------------------------------------------------------------
# Splits & new windows preserve the current working directory
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Screen habits: K to kill pane, A to rename window, w or ' for window list
bind K confirm-before -p "Kill pane #P? (y/n)" kill-pane
bind A command-prompt -I "#W" "rename-window '%%'"
bind w choose-tree -Zw
bind "'" choose-tree -Zw

# Pane cycling & repeatable resizing
unbind o
bind C-s select-pane -t :.+
bind Tab select-pane -t :.+
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -----------------------------------------------------------------------------
# 4. Vi Copy Mode + Cross-Platform Clipboard Integration (bin/dev-copy)
# -----------------------------------------------------------------------------
unbind [
bind Escape copy-mode
bind [ copy-mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$HOME/bin/dev-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "$HOME/bin/dev-copy"

# -----------------------------------------------------------------------------
# 5. Seamless Neovim <-> tmux Pane Navigation (Ctrl-h/j/k/l)
# -----------------------------------------------------------------------------
# Passes Ctrl-h/j/k/l into Neovim when focused in an editor pane, otherwise switches tmux panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

# -----------------------------------------------------------------------------
# 6. Antigravity CLI (agy) Dedicated Workflows (with smart shell fallback)
# -----------------------------------------------------------------------------
# Ctrl-a g : Toggle a floating 85%x85% popup running a persistent per-repo agy session (or bash if agy is not installed)
bind g display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "tmux new-session -A -s 'agy-#{b:pane_current_path}' 'command -v agy >/dev/null 2>&1 && exec agy || { echo \"[ade] agy not found on PATH — starting interactive shell\"; exec \${SHELL:-bash} -l; }'"

# Ctrl-a G : Open a side-by-side right pane (38% width) running agy in the current directory (or bash if agy is not installed)
bind G split-window -h -l 38% -c "#{pane_current_path}" "command -v agy >/dev/null 2>&1 && exec agy || { echo '[ade] agy not found on PATH — starting interactive shell'; exec \${SHELL:-bash} -l; }"

# -----------------------------------------------------------------------------
# 7. Status Bar (GNU Screen hardstatus style + cross-platform loadavg)
# -----------------------------------------------------------------------------
set -g status-style bg=black,fg=white
set -g status-interval 2
set -g status-left-length 30
set -g status-right-length 65
set -g status-left '#[fg=green][ #H ][#[default] '
set -g status-right '#[fg=green]][#[fg=yellow] #(sysctl -n vm.loadavg 2>/dev/null | awk "{print \$2,\$3,\$4}" || cut -d " " -f 1-3 /proc/loadavg 2>/dev/null) #[fg=green]][#[fg=cyan,bold] %Y-%m-%d %H:%M:%S #[fg=green]]#[default]'

setw -g window-status-current-style bg=red,fg=white,bold
setw -g window-status-current-format '(#I*#F#W)'
setw -g window-status-format ' #I:#W#F '

setw -g monitor-activity on
set -g visual-activity on
setw -g clock-mode-colour green
setw -g clock-mode-style 24
